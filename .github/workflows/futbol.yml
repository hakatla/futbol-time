name: Futbol Time

on:
  schedule:
    - cron: "17 */3 * * *"   # cada 3 horas
  workflow_dispatch:          # botón "Run workflow" para ejecutarlo a mano

permissions:
  contents: write

concurrency:
  group: futbol-time
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar partidos y programar avisos
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGINA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python futbol_time.py

      - name: Guardar cambios
        run: |
          git config user.name "futbol-time-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs estado_avisos.json 2>/dev/null || git add docs
          git diff --cached --quiet || git commit -m "Actualizar partidos $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
